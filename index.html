<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>乌龟寻宝演化模拟</title>
    <style>
        :root { --red: #ff7675; --green: #00b894; --blue: #74b9ff; --panel: #1e272e; --active-color: #00b894; }
        * { box-sizing: border-box; } 

        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: #dfe6e9; display: flex; justify-content: center; align-items: center;
            padding: 1vh; margin: 0; height: 100vh; overflow: hidden; 
        }

        #app-container { 
            background: #ffffff; padding: 1.5vw; border-radius: 24px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); 
            display: flex; gap: 1.5vw; width: 98vw; height: 96vh; min-height: 0;
        }
        
        #left-panel { 
            flex: 0 0 22%; border-right: 1px solid #f1f2f6; padding-right: 1.2vw; 
            display: flex; flex-direction: column; 
            justify-content: space-between; overflow: hidden;
        }

        #log-area { 
            flex: 0 0 22%; background: var(--panel); border-radius: 20px; padding: 1.2vw; 
            display: flex; flex-direction: column; border: 2px solid var(--active-color); flex-shrink: 0; 
        }

        #center-area { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; min-width: 0; }

        .monitor-card { 
            background: #f8f9fa; border-radius: 20px; padding: 2vh 1vw; margin-bottom: 1vh; 
            border: 1px solid #e9ecef; text-align: center; 
        }
        /* 更新为实时任务进度 */
        .monitor-card h3 { margin: 0 0 1vh 0; font-size: clamp(12px, 1.4vh, 14px); color: #636e72; letter-spacing: 1px; }

        .step-circle { 
            width: clamp(60px, 11vh, 90px); height: clamp(60px, 11vh, 90px); 
            border-radius: 50%; margin: 0 auto 1vh; 
            display: flex; align-items: center; justify-content: center; position: relative;
            background: conic-gradient(var(--active-color) 0deg, #eee 0deg);
        }
        .step-circle::after {
            content: ""; position: absolute; width: 80%; height: 80%; background: #f8f9fa; border-radius: 50%;
        }
        #step-display { font-size: clamp(18px, 3.5vh, 28px); font-weight: 900; color: #2d3436; z-index: 1; }
        
        .status-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: var(--active-color); margin-right: 8px;
            box-shadow: 0 0 8px var(--active-color);
            animation: pulse 1.5s infinite;
            vertical-align: middle;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        .detail-row { display: flex; align-items: center; justify-content: space-between; padding: 0.7vh 0; border-bottom: 1px dashed #ddd; font-size: clamp(10px, 1.2vh, 12px); color: #2d3436; }

        .config-section {
            border: 1px solid #e1e8f0; border-radius: 18px; padding: 1.5vh 1vw 1vh; margin-bottom: 1vh;
            background: #f1f2f6; position: relative;
        }
        .config-label {
            position: absolute; top: -10px; left: 15px; background: #fff;
            padding: 0 8px; font-size: 10px; color: #95a5a6; font-weight: bold;
            border: 1px solid #e1e8f0; border-radius: 10px;
        }

        .slider-group { margin-bottom: 0.5vh; background: #fff; padding: 0.5vh 0.8vw; border-radius: 10px; border: 1px solid #edf2f7; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 10px; color: #636e72; margin-bottom: 2px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--active-color); height: 12px; }

        #canvas-wrapper { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            background: #fafafa; border-radius: 20px; border: 2px solid #f1f2f6; 
            overflow: hidden; padding: 10px;
        }

        canvas { border: 4px solid #2d3436; border-radius: 12px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        #mode-controls { display: flex; gap: 1vw; justify-content: center; padding: 5px 0; flex-shrink: 0; }
        .btn-mode { flex: 1; max-width: 140px; border: none; padding: 1.6vh 5px; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: clamp(11px, 1.2vw, 14px); }
        .btn-r { background: var(--red); box-shadow: 0 4px 0 #d63031; } 
        .btn-f { background: var(--green); box-shadow: 0 4px 0 #00897b; } 
        .btn-s { background: var(--blue); box-shadow: 0 4px 0 #0984e3; } 
        .btn-mode:active { transform: translateY(2px); box-shadow: none; }

        #log-area h4 { color: #fff; margin: 0 0 10px 0; font-size: 14px; border-left: 4px solid var(--active-color); padding-left: 10px; }
        #path-list { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 11px; color: var(--active-color); scrollbar-width: none; }
        .log-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        #msg-status { height: 24px; color: var(--active-color); font-weight: bold; text-align: center; font-size: clamp(14px, 1.8vh, 18px); flex-shrink: 0; }
        select { width: 100%; padding: 0.6vh; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 12px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="left-panel">
        <div>
            <div class="monitor-card">
                <h3>实时任务进度</h3>
                <div class="step-circle" id="step-ring"><div id="step-display">0</div></div>
                <div class="detail-row">
                    <span>状态:</span>
                    <span><span class="status-dot"></span><b id="mode-text">系统就绪</b></span>
                </div>
                <div class="detail-row"><span>坠崖重置:</span><span id="fail-display">0</span></div>
                <div class="detail-row"><span>坐标:</span><span id="coord-display">[0, 3]</span></div>
            </div>

            <div class="config-section">
                <div class="config-label">移动方向概率</div>
                <div class="slider-group"><label>向上 (UP) <b id="val-u">0.25</b></label><input type="range" id="sl-u" oninput="manualSync()"></div>
                <div class="slider-group"><label>向右 (RIGHT) <b id="val-r">0.25</b></label><input type="range" id="sl-r" oninput="manualSync()"></div>
                <div class="slider-group"><label>向下 (DOWN) <b id="val-d">0.25</b></label><input type="range" id="sl-d" oninput="manualSync()"></div>
                <div class="slider-group"><label>向左 (LEFT) <b id="val-l">0.25</b></label><input type="range" id="sl-l" oninput="manualSync()"></div>
            </div>
        </div>

        <div style="padding-bottom:1vh;">
            <label style="font-size: 10px; color: #999; display:block; margin-bottom:5px;">模拟演示速度</label>
            <select id="speed">
                <option value="1" selected>瞬间到达</option>
                <option value="25">极速播放</option>
                <option value="80">标准速度</option>
                <option value="200">慢速观察</option>
            </select>
        </div>
    </div>

    <div id="center-area">
        <div id="msg-status">系统就绪</div>
        <div id="canvas-wrapper">
            <canvas id="world"></canvas>
        </div>
        <div id="mode-controls">
            <button class="btn-mode btn-r" onclick="run('random')">独行龟模式</button>
            <button class="btn-mode btn-f" onclick="run('follow')">随行龟模式</button>
            <button class="btn-mode btn-s" onclick="run('smart')">智慧龟模式</button>
        </div>
    </div>

    <div id="log-area">
        <h4>实时路径记录</h4>
        <div id="path-list"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('world'), ctx = canvas.getContext('2d');
    const logList = document.getElementById('path-list'), ring = document.getElementById('step-ring');
    const COLS = 12, ROWS = 4;
    let CELL = 80, pos = {x:0, y:3}, history = [], timer = null, turtleColor = '#00b894';

    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        const availableW = wrapper.clientWidth * 0.95;
        const availableH = wrapper.clientHeight * 0.95;
        CELL = Math.min(availableW / COLS, availableH / ROWS);
        canvas.width = CELL * COLS; canvas.height = CELL * ROWS;
        draw();
    }

    window.addEventListener('resize', resizeCanvas);

    function drawTurtle(x, y, color) {
        ctx.save();
        ctx.translate(x * CELL + CELL/2, y * CELL + CELL/2);
        const s = CELL/85; // 缩放因子
        ctx.scale(s, s);
        
        // 四肢
        ctx.fillStyle = color;
        ctx.fillRect(-20, -20, 8, 8); // 左前
        ctx.fillRect(12, -20, 8, 8);  // 右前
        ctx.fillRect(-20, 12, 8, 8);  // 左后
        ctx.fillRect(12, 12, 8, 8);   // 右后
        
        // 龟壳主体
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        
        // 龟壳纹路
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = 1;
        // 六边形中心
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(7, -4);
        ctx.lineTo(7, 4);
        ctx.lineTo(0, 8);
        ctx.lineTo(-7, 4);
        ctx.lineTo(-7, -4);
        ctx.closePath();
        ctx.stroke();
        // 连接到边缘
        ctx.beginPath();
        ctx.moveTo(0, -8); ctx.lineTo(0, -18);
        ctx.moveTo(7, -4); ctx.lineTo(16, -9);
        ctx.moveTo(7, 4); ctx.lineTo(16, 9);
        ctx.moveTo(0, 8); ctx.lineTo(0, 18);
        ctx.moveTo(-7, 4); ctx.lineTo(-16, 9);
        ctx.moveTo(-7, -4); ctx.lineTo(-16, -9);
        ctx.stroke();

        // 头部
        ctx.beginPath();
        ctx.arc(0, -25, 8, 0, Math.PI * 2);
        ctx.fill();
        
        // 眼睛
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(-3, -27, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3, -27, 2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(-3, -27, 1, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3, -27, 1, 0, Math.PI*2); ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                // 再次加深地图线条至 #a0a8b0，使其非常明显
                ctx.strokeStyle="#a0a8b0"; 
                ctx.lineWidth = 1; 
                ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);

                if(r===3 && c>0 && c<11) { ctx.fillStyle="#2d3436"; ctx.fillRect(c*CELL, r*CELL, CELL, CELL); }
                if(r===3 && c===11) { 
                    ctx.fillStyle="#f39c12"; ctx.fillRect(c*CELL, r*CELL, CELL, CELL); 
                    ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.font=`bold ${CELL/5}px "Microsoft YaHei"`; ctx.textAlign="center";
                    ctx.fillText("终点", c*CELL+CELL/2, r*CELL+CELL/1.8);
                }
                ctx.save();
                ctx.font = `${CELL/7}px "Microsoft YaHei", monospace`; ctx.textAlign = "right";
                ctx.fillStyle = (r===3 && c>0 && c<11) ? "#95a5a6" : "#b2bec3";
                ctx.fillText(`[${c},${r}]`, (c+1)*CELL - 5, (r+1)*CELL - 5);
                ctx.restore();
            }
        }
        ctx.beginPath(); ctx.setLineDash([5,3]); ctx.strokeStyle="rgba(100,100,100,0.3)"; ctx.lineWidth = 2;
        history.forEach((p,i) => { if(i===0) ctx.moveTo((p.x+.5)*CELL, (p.y+.5)*CELL); else ctx.lineTo((p.x+.5)*CELL, (p.y+.5)*CELL); });
        ctx.stroke(); ctx.setLineDash([]); 
        drawTurtle(pos.x, pos.y, turtleColor);
    }

    function manualSync() {
        let v = ['u','r','d','l'].map(k => parseInt(document.getElementById('sl-'+k).value || 25));
        let total = v.reduce((a,b)=>a+b) || 1;
        ['u','r','d','l'].forEach((k,i) => document.getElementById('val-'+k).innerText = (v[i]/total).toFixed(2));
    }

    function run(m) {
        if(timer) clearInterval(timer);
        document.getElementById('msg-status').innerText = "逻辑演算中...";
        logList.innerHTML = "";
        const config = { 'random': '#ff7675', 'follow': '#00b894', 'smart': '#74b9ff' };
        turtleColor = config[m];
        document.documentElement.style.setProperty('--active-color', turtleColor);
        if(m==='random') { ['sl-u','sl-r','sl-d','sl-l'].forEach(id=>document.getElementById(id).value=25); }
        else { document.getElementById('sl-u').value=20; document.getElementById('sl-r').value=40; 
               document.getElementById('sl-d').value=20; document.getElementById('sl-l').value=20; }
        manualSync();
        const limits = { 'random': [1000, 2000], 'follow': [400, 800], 'smart': [12, 100] };
        const [minSteps, maxSteps] = limits[m];

        setTimeout(() => {
            const weights = ['val-u','val-r','val-d','val-l'].map(id => parseFloat(document.getElementById(id).innerText));
            let finalHistory = null;
            for(let attempt = 0; attempt < 5000; attempt++) {
                let tp={x:0,y:3}, ts=0, tf=0, th=[{p:{...tp},f:0}], visited={};
                visited[`0,3`] = 1;
                while(ts < 2001 && !(tp.x===11 && tp.y===3)) {
                    let opts = [{x:0,y:-1,p:weights[0]}, {x:1,y:0,p:weights[1]}, {x:0,y:1,p:weights[2]}, {x:-1,y:0,p:weights[3]}];
                    if(m === 'smart') {
                        opts.forEach(o => {
                            let nx = tp.x + o.x, ny = tp.y + o.y;
                            let count = visited[`${nx},${ny}`] || 0;
                            if(count > 0) o.p *= Math.pow(0.1, count);
                            if(nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) o.p = 0;
                        });
                    }
                    let sum = opts.reduce((a,b)=>a+b.p, 0);
                    let move;
                    if(sum <= 0) {
                        let legals = opts.filter(o => {
                            let nx = tp.x + o.x, ny = tp.y + o.y;
                            return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS;
                        });
                        move = legals[Math.floor(Math.random()*legals.length)];
                    } else {
                        let rand = Math.random() * sum;
                        for(let o of opts){ if(rand <= o.p){ move = o; break; } rand -= o.p; }
                    }
                    let nx = tp.x + move.x, ny = tp.y + move.y;
                    if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS) {
                        if(ny===3 && nx>0 && nx<11) { tp={x:0,y:3}; tf++; visited={}; visited[`0,3`]=1; }
                        else { tp={x:nx,y:ny}; visited[`${nx},${ny}`] = (visited[`${nx},${ny}`] || 0) + 1; }
                    }
                    ts++; th.push({p:{...tp},f:tf});
                }
                if(th.length >= minSteps && th.length <= maxSteps) { finalHistory = th; break; }
                if(attempt === 4999) finalHistory = th;
            }

            document.getElementById('msg-status').innerText = "模拟执行中...";
            document.getElementById('mode-text').innerText = "正在运行";
            let i = 0; history = [];
            timer = setInterval(() => {
                const cur = finalHistory[i]; pos = cur.p; history.push({...pos});
                document.getElementById('step-display').innerText = i;
                ring.style.background = `conic-gradient(var(--active-color) ${(i/(finalHistory.length-1))*360}deg, #eee 0deg)`;
                document.getElementById('fail-display').innerText = cur.f;
                document.getElementById('coord-display').innerText = `[${pos.x}, ${pos.y}]`;
                const item = document.createElement('div'); item.className='log-item';
                item.innerHTML = `<span>步数 ${i}</span><span>[${pos.x}, ${pos.y}]</span>`;
                logList.prepend(item);
                draw();
                if(++i >= finalHistory.length) { 
                    clearInterval(timer);
                    document.getElementById('mode-text').innerText = "任务达成"; document.getElementById('msg-status').innerText = "任务达成";
                }
            }, parseInt(document.getElementById('speed').value));
        }, 50);
    }

    manualSync(); resizeCanvas();
</script>
</body>
</html>
