<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>乌龟寻宝 - 种子演算 PC 增强版</title>
    <style>
        :root { --primary: #0984e3; --bg: #dfe6e9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 30px; }
        
        #main-container { display: flex; gap: 20px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }

        /* 左侧控制区 */
        #side-panel { width: 280px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #eee; padding-right: 20px; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center; }
        #step-count { font-size: 48px; font-weight: bold; color: #2d3436; }
        .label { font-size: 12px; color: #636e72; text-transform: uppercase; letter-spacing: 1px; }

        .weight-setting { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .w-input-group { display: flex; flex-direction: column; font-size: 13px; }
        input[type="number"] { padding: 5px; border: 1px solid #ddd; border-radius: 4px; }

        /* 右侧画布区 */
        #game-area { display: flex; flex-direction: column; align-items: center; }
        canvas { background: white; border: 4px solid #2d3436; border-radius: 8px; cursor: crosshair; }

        /* 底部按钮 */
        #button-group { margin-top: 20px; display: flex; gap: 15px; }
        button { padding: 12px 25px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-r { background: #636e72; }
        .btn-f { background: #0984e3; }
        .btn-s { background: #00b894; }
        #loading-msg { color: #d63031; font-weight: bold; font-size: 14px; height: 20px; }

        .cliff-hint { font-size: 12px; color: #b2bec3; margin-top: 10px; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="side-panel">
        <div class="stat-card">
            <div class="label">当前步数</div>
            <div id="step-count">0</div>
            <div id="loading-msg"></div>
        </div>

        <div class="weight-setting">
            <div class="w-input-group"><label>上 (UP)</label><input type="number" id="w-u" value="0.2" step="0.1"></div>
            <div class="w-input-group"><label>右 (RIGHT)</label><input type="number" id="w-r" value="0.4" step="0.1"></div>
            <div class="w-input-group"><label>下 (DOWN)</label><input type="number" id="w-d" value="0.2" step="0.1"></div>
            <div class="w-input-group"><label>左 (LEFT)</label><input type="number" id="w-l" value="0.2" step="0.1"></div>
        </div>

        <select id="speed-ctrl" style="padding: 8px; border-radius: 5px;">
            <option value="100">演示速度：常规</option>
            <option value="20">演示速度：快速</option>
            <option value="1">演示速度：瞬间</option>
        </select>
        
        <div class="cliff-hint">
            * 独行龟阈值: 2000-3000<br>
            * 随行龟阈值: 500-1000<br>
            * 智慧龟: 仅靠记忆惩罚避障
        </div>
    </div>

    <div id="game-area">
        <canvas id="canvas" width="720" height="240"></canvas>
        <div id="button-group">
            <button class="btn-r" onclick="initiateRun('random')">独行龟演算</button>
            <button class="btn-f" onclick="initiateRun('follow')">随行龟演算</button>
            <button class="btn-s" onclick="initiateRun('smart')">智慧龟演示</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const COLS = 12, ROWS = 4, SIZE = 60;
    
    let pos = {x:0, y:3}, history = [], visits = {}, timer = null;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 背景格
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                ctx.strokeStyle = "#f1f2f6"; ctx.strokeRect(c*SIZE, r*SIZE, SIZE, SIZE);
                if(r===3 && c>0 && c<11) { ctx.fillStyle="#2d3436"; ctx.fillRect(c*SIZE, r*SIZE, SIZE, SIZE); }
                if(r===3 && c===11) { ctx.fillStyle="#f1c40f"; ctx.fillRect(c*SIZE, r*SIZE, SIZE, SIZE); }
            }
        }
        // 足迹
        ctx.beginPath(); ctx.setLineDash([4, 2]); ctx.strokeStyle="#b2bec3";
        history.forEach((p, i) => {
            if(i===0) ctx.moveTo((p.x+.5)*SIZE, (p.y+.5)*SIZE);
            else ctx.lineTo((p.x+.5)*SIZE, (p.y+.5)*SIZE);
        });
        ctx.stroke(); ctx.setLineDash([]);
        // 乌龟
        ctx.font = "30px Arial"; ctx.textAlign="center";
        ctx.fillText("🐢", (pos.x+.5)*SIZE, (pos.y+.5)*SIZE+10);
    }

    // 核心决策逻辑
    function decide(mode, currentPos, currentVisits) {
        const u = parseFloat(document.getElementById('w-u').value);
        const r = parseFloat(document.getElementById('w-r').value);
        const d = parseFloat(document.getElementById('w-d').value);
        const l = parseFloat(document.getElementById('w-l').value);
        
        let opts = [{x:0,y:-1,p:u},{x:1,y:0,p:r},{x:0,y:1,p:d},{x:-1,y:0,p:l}];

        if(mode === 'smart') {
            opts.forEach(o => {
                let nx = currentPos.x + o.x, ny = currentPos.y + o.y;
                let v = currentVisits[`${nx},${ny}`] || 0;
                o.p *= Math.pow(0.1, v); // 记忆衰减
                if(nx<0 || nx>=COLS || ny<0 || ny>=ROWS) o.p = 0;
            });
        }

        let sum = opts.reduce((a,b)=>a+b.p, 0);
        if(sum === 0) return opts[Math.floor(Math.random()*4)];
        let rand = Math.random()*sum;
        for(let o of opts) { if(rand <= o.p) return o; rand -= o.p; }
        return opts[1];
    }

    // 种子演算：模拟直至满足条件
    function preCalculate(mode) {
        const minSteps = mode==='random'? 2000 : (mode==='follow'? 500 : 0);
        const maxSteps = mode==='random'? 3000 : (mode==='follow'? 1000 : Infinity);
        
        let attempt = 0;
        while(attempt < 5000) { // 防止无限循环
            let tempPos = {x:0, y:3}, tempSteps = 0, tempHistory = [{...tempPos}], tempVisits = {"0,3":1};
            
            while(tempSteps < 5000) {
                let m = decide(mode, tempPos, tempVisits);
                let nx = tempPos.x + m.x, ny = tempPos.y + m.y;
                
                if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS) {
                    if(ny===3 && nx>0 && nx<11) { tempPos = {x:0, y:3}; } // 掉下悬崖
                    else { 
                        tempPos = {x:nx, y:ny}; 
                        tempVisits[`${nx},${ny}`] = (tempVisits[`${nx},${ny}`]||0)+1; 
                    }
                    tempSteps++;
                    tempHistory.push({...tempPos});
                    if(tempPos.x===11 && tempPos.y===3) break;
                } else {
                    tempSteps++; // 撞墙也算步数
                }
            }
            
            if(tempSteps >= minSteps && tempSteps <= maxSteps) return tempHistory;
            attempt++;
        }
        return null;
    }

    function initiateRun(mode) {
        if(timer) clearInterval(timer);
        document.getElementById('loading-msg').innerText = "正在演算最优种子...";
        
        // 设置初始权重
        if(mode === 'random') {
            ['w-u','w-r','w-d','w-l'].forEach(id => document.getElementById(id).value = 0.25);
        } else {
            document.getElementById('w-u').value = 0.2; document.getElementById('w-r').value = 0.4;
            document.getElementById('w-d').value = 0.2; document.getElementById('w-l').value = 0.2;
        }

        // 异步执行演算，防止界面卡死
        setTimeout(() => {
            const finalPath = preCalculate(mode);
            document.getElementById('loading-msg').innerText = "";
            
            if(!finalPath) { alert("未能在限制内找到合适种子，请重试"); return; }
            
            let i = 0;
            pos = finalPath[0];
            history = [];
            
            timer = setInterval(() => {
                pos = finalPath[i];
                history.push(pos);
                document.getElementById('step-count').innerText = i;
                draw();
                i++;
                if(i >= finalPath.length) clearInterval(timer);
            }, document.getElementById('speed-ctrl').value);
        }, 50);
    }

    draw();
</script>
</body>
</html>
