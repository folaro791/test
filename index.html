<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>乌龟寻宝演化模拟</title>
    <style>
        :root { --red: #ff7675; --green: #00b894; --blue: #74b9ff; --panel: #1e272e; --active-color: #00b894; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #dfe6e9; display: flex; justify-content: center; padding: 20px; margin: 0; height: 100vh; overflow: hidden; }
        #app-container { background: #ffffff; padding: 25px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; gap: 25px; width: 98vw; height: 92vh; box-sizing: border-box; }
        
        #left-panel { width: 280px; border-right: 1px solid #f1f2f6; padding-right: 20px; display: flex; flex-direction: column; flex-shrink: 0; }
        .monitor-card { background: #f8f9fa; border-radius: 20px; padding: 15px; margin-bottom: 15px; border: 1px solid #e9ecef; text-align: center; }
        .monitor-card h3 { margin: 0 0 12px 0; font-size: 13px; color: #636e72; letter-spacing: 1px; }

        /* 动态进度环核心样式 */
        .step-circle { 
            width: 120px; height: 120px; border-radius: 50%; 
            margin: 0 auto 10px; 
            display: flex; align-items: center; justify-content: center; 
            position: relative;
            /* 默认底色 */
            background: conic-gradient(var(--active-color) 0deg, #eee 0deg);
            transition: background 0.1s linear;
        }
        /* 遮罩层，让背景看起来像圆环 */
        .step-circle::after {
            content: "";
            position: absolute;
            width: 100px; height: 100px;
            background: #f8f9fa;
            border-radius: 50%;
        }
        #step-display { font-size: 34px; font-weight: 900; color: #2d3436; z-index: 1; }
        
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ddd; font-size: 12px; color: #2d3436; }
        .status-dot { width: 8px; height: 8px; background: var(--active-color); border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px var(--active-color); }

        .weight-ui { background: #f1f2f6; padding: 15px; border-radius: 18px; }
        .slider-group { margin-bottom: 10px; background: #fff; padding: 8px 12px; border-radius: 10px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 11px; color: #636e72; margin-bottom: 5px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--active-color); }

        #center-area { flex: 3; display: flex; flex-direction: column; gap: 15px; min-width: 0; }
        #canvas-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; background: #fafafa; border-radius: 24px; border: 2px solid #f1f2f6; overflow: hidden; position: relative; }
        canvas { border: 5px solid #2d3436; border-radius: 16px; background: #fff; max-width: 100%; max-height: 100%; }
        
        #mode-controls { display: flex; gap: 15px; justify-content: center; padding: 10px 0; flex-shrink: 0; }
        .btn-mode { flex: 1; max-width: 200px; border: none; padding: 18px; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .btn-r { background: var(--red); box-shadow: 0 6px 0 #d63031; } 
        .btn-f { background: var(--green); box-shadow: 0 6px 0 #00897b; } 
        .btn-s { background: var(--blue); box-shadow: 0 6px 0 #0984e3; } 
        .btn-mode:active { transform: translateY(4px); box-shadow: none; }

        #log-area { width: 300px; background: var(--panel); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; border: 2px solid var(--active-color); transition: 0.5s; flex-shrink: 0; }
        #log-area h4 { color: #fff; margin: 0 0 15px 0; font-size: 15px; border-left: 4px solid var(--active-color); padding-left: 12px; }
        #path-list { flex: 1; overflow-y: auto; font-family: 'Consolas', '微软雅黑', monospace; font-size: 13px; color: var(--active-color); }
        .log-item { display: flex; justify-content: space-between; padding: 8px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        #msg-status { height: 26px; color: var(--active-color); font-weight: bold; text-align: center; font-size: 18px; flex-shrink: 0; }
        select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; background: #fff; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="left-panel">
        <div class="monitor-card">
            <h3>实时任务状态</h3>
            <div class="step-circle" id="step-ring">
                <div id="step-display">0</div>
            </div>
            <div class="detail-row"><span>当前状态:</span><span><span class="status-dot"></span><b id="mode-text">系统就绪</b></span></div>
            <div class="detail-row"><span>坠崖总数:</span><span style="color:#e17055;" id="fail-display">0</span></div>
            <div class="detail-row"><span>当前坐标:</span><span id="coord-display">[0, 3]</span></div>
        </div>

        <div class="weight-ui">
            <div class="group-title">概率参数配置</div>
            <div class="slider-group"><label>向上概率 (UP) <b id="val-u">0.25</b></label><input type="range" id="sl-u" oninput="manualSync()"></div>
            <div class="slider-group"><label>向右概率 (RIGHT) <b id="val-r">0.25</b></label><input type="range" id="sl-r" oninput="manualSync()"></div>
            <div class="slider-group"><label>向下概率 (DOWN) <b id="val-d">0.25</b></label><input type="range" id="sl-d" oninput="manualSync()"></div>
            <div class="slider-group"><label>向左概率 (LEFT) <b id="val-l">0.25</b></label><input type="range" id="sl-l" oninput="manualSync()"></div>
        </div>

        <div style="margin-top:auto; padding:10px;">
            <label style="font-size: 11px; color: #999;">模拟步进频率</label>
            <select id="speed">
                <option value="80">标准速度</option>
                <option value="25">极速模拟</option>
                <option value="1">瞬间收敛</option>
            </select>
        </div>
    </div>

    <div id="center-area">
        <div id="msg-status">系统就绪</div>
        <div id="canvas-wrapper">
            <canvas id="world"></canvas>
        </div>
        <div id="mode-controls">
            <button class="btn-mode btn-r" onclick="run('random')">独行龟模式</button>
            <button class="btn-mode btn-f" onclick="run('follow')">随行龟模式</button>
            <button class="btn-mode btn-s" onclick="run('smart')">智慧龟模式</button>
        </div>
    </div>

    <div id="log-area">
        <h4>实时路径记录</h4>
        <div id="path-list"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('world'), ctx = canvas.getContext('2d'), logList = document.getElementById('path-list');
    const ring = document.getElementById('step-ring');
    const COLS = 12, ROWS = 4;
    let CELL = 85; 
    let pos = {x:0, y:3}, history = [], timer = null, turtleColor = '#00b894';

    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        const padding = 40;
        const cellW = (wrapper.clientWidth - padding) / COLS;
        const cellH = (wrapper.clientHeight - padding) / ROWS;
        CELL = Math.min(cellW, cellH, 100);
        canvas.width = CELL * COLS;
        canvas.height = CELL * ROWS;
        draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function updateActiveUI(color) {
        document.documentElement.style.setProperty('--active-color', color);
        // 重置圆环进度
        ring.style.background = `conic-gradient(${color} 0deg, #eee 0deg)`;
    }

    function drawCuteTurtle(x, y, color) {
        ctx.save();
        ctx.translate(x * CELL + CELL/2, y * CELL + CELL/2);
        const scale = CELL / 85;
        ctx.scale(scale, scale);
        ctx.fillStyle = color;
        [[-15, -15], [15, -15], [-15, 10], [15, 10]].forEach(p => {
            ctx.beginPath(); ctx.ellipse(p[0], p[1], 6, 4, Math.PI/4, 0, Math.PI*2); ctx.fill();
        });
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -22, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(-4, -24, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4, -24, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath(); ctx.arc(-4, -24, 1.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4, -24, 1.2, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function manualSync() {
        let v = ['u','r','d','l'].map(k => parseInt(document.getElementById('sl-'+k).value || 25));
        let total = v.reduce((a,b)=>a+b) || 1;
        ['u','r','d','l'].forEach((k,i) => document.getElementById('val-'+k).innerText = (v[i]/total).toFixed(2));
    }

    function setProbabilities(u, r, d, l) {
        document.getElementById('sl-u').value = u * 100;
        document.getElementById('sl-r').value = r * 100;
        document.getElementById('sl-d').value = d * 100;
        document.getElementById('sl-l').value = l * 100;
        manualSync();
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                ctx.strokeStyle="#f1f2f6"; ctx.lineWidth = 1; ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);
                if(r===3 && c>0 && c<11) { ctx.fillStyle="#2d3436"; ctx.fillRect(c*CELL, r*CELL, CELL, CELL); }
                if(r===3 && c===11) { 
                    ctx.fillStyle="#f39c12"; ctx.fillRect(c*CELL, r*CELL, CELL, CELL); 
                    ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.font=`bold ${CELL/4}px Arial`; ctx.textAlign="center";
                    ctx.fillText("终点", c*CELL+CELL/2, r*CELL+CELL/1.8);
                }
            }
        }
        ctx.beginPath(); ctx.setLineDash([6,4]); ctx.strokeStyle="rgba(100,100,100,0.3)"; ctx.lineWidth = 2;
        history.forEach((p,i) => { if(i===0) ctx.moveTo((p.x+.5)*CELL, (p.y+.5)*CELL); else ctx.lineTo((p.x+.5)*CELL, (p.y+.5)*CELL); });
        ctx.stroke(); ctx.setLineDash([]);
        drawCuteTurtle(pos.x, pos.y, turtleColor);
    }

    function getDir(mode, cp, cv, isR) {
        if(mode==='smart' && isR) return {x:0, y:-1};
        const w = ['val-u','val-r','val-d','val-l'].map(id => parseFloat(document.getElementById(id).innerText));
        let opts = [{x:0,y:-1,p:w[0]},{x:1,y:0,p:w[1]},{x:0,y:1,p:w[2]},{x:-1,y:0,p:w[3]}];
        if(mode==='smart') {
            opts.forEach(o => { o.p *= Math.pow(0.12, cv[`${cp.x+o.x},${cp.y+o.y}`]||0); if(cp.x+o.x<0||cp.x+o.x>=COLS||cp.y+o.y<0||cp.y+o.y>=ROWS) o.p=0; });
        }
        let sum = opts.reduce((a,b)=>a+b.p, 0);
        if(sum<=0) return opts[1];
        let rand = Math.random()*sum;
        for(let o of opts) { if(rand<=o.p) return o; rand-=o.p; }
        return opts[1];
    }

    function preCalc(mode) {
        const min = mode==='random' ? 1500 : (mode==='follow'? 500 : 0);
        const max = mode==='random' ? 2000 : (mode==='follow'? 1000 : 100); 
        for(let a=0; a<10000; a++) {
            let tp={x:0,y:3}, ts=0, tf=0, th=[{p:{...tp}, f:tf}], tv={}, isR=true;
            while(ts < 8000) {
                let m = getDir(mode, tp, tv, isR); isR = false;
                let nx=tp.x+m.x, ny=tp.y+m.y;
                if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS) {
                    if(ny===3 && nx>0 && nx<11) { tp={x:0,y:3}; tf++; if(mode==='smart') tv={}; isR=true; }
                    else { tp={x:nx, y:ny}; tv[`${nx},${ny}`]=(tv[`${nx},${ny}`]||0)+1; }
                    ts++; th.push({p:{...tp}, f:tf});
                } else { ts++; th.push({p:{...tp}, f:tf}); }
                if(tp.x===11 && tp.y===3) break;
            }
            if(ts >= min && ts <= max) return th;
        }
        return null;
    }

    function run(m) {
        if(timer) clearInterval(timer);
        document.getElementById('msg-status').innerText = "演算随机种子中...";
        document.getElementById('mode-text').innerText = "正在演算...";
        logList.innerHTML = "";
        
        const config = { 'random': '#ff7675', 'follow': '#00b894', 'smart': '#74b9ff' };
        turtleColor = config[m];
        updateActiveUI(turtleColor);

        if(m==='random') setProbabilities(0.25, 0.25, 0.25, 0.25);
        else setProbabilities(0.2, 0.4, 0.2, 0.2);

        setTimeout(() => {
            const data = preCalc(m);
            if(!data) { document.getElementById('msg-status').innerText = "演算超时"; return; }
            
            document.getElementById('msg-status').innerText = "正在执行导航任务...";
            document.getElementById('mode-text').innerText = "正在模拟";
            
            let i = 0; 
            const totalSteps = data.length - 1; // 总步数
            history = [];
            
            timer = setInterval(() => {
                const cur = data[i]; pos = cur.p; history.push({...pos});
                
                // 1. 更新步数显示
                document.getElementById('step-display').innerText = i;
                
                // 2. 更新圆环进度百分比
                const percentDegree = (i / totalSteps) * 360;
                ring.style.background = `conic-gradient(var(--active-color) ${percentDegree}deg, #eee 0deg)`;

                document.getElementById('fail-display').innerText = cur.f;
                document.getElementById('coord-display').innerText = `[${pos.x}, ${pos.y}]`;
                
                const item = document.createElement('div'); item.className = 'log-item';
                item.innerHTML = `<span>第 ${i.toString().padStart(4,'0')} 步</span><span>坐标位置 [${pos.x}, ${pos.y}]</span>`;
                logList.prepend(item);
                
                draw();
                if(++i > totalSteps) { 
                    clearInterval(timer); 
                    document.getElementById('mode-text').innerText = "任务达成"; 
                    document.getElementById('msg-status').innerText = "任务达成";
                    // 确保进度条最后补满
                    ring.style.background = `conic-gradient(var(--active-color) 360deg, #eee 0deg)`;
                }
            }, document.getElementById('speed').value);
        }, 50);
    }

    manualSync();
    resizeCanvas();
</script>
</body>
</html>
