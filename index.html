<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>乌龟寻宝演化模拟</title>
    <style>
        :root { 
            --red: #ff7675; --green: #00b894; --blue: #0984e3; --panel: #1e272e; --active-color: #00b894; 
            --bg-body: #F0F3F7;
            --bg-panel: rgba(255, 255, 255, 0.8);
            --bg-terminal: #1c252e;
            --text-main: #2d3436;
            --text-sec: #636e72;
            --border-soft: #e0e6ed;
            --sh-soft: 0 10px 30px rgba(160, 175, 190, 0.15);
            --sh-inset: inset 2px 2px 5px rgba(0,0,0,0.05), inset -2px -2px 5px rgba(255,255,255,0.8);
        }
        * { box-sizing: border-box; } 

        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: var(--bg-body); display: flex; justify-content: center; align-items: center;
            padding: 1vh; margin: 0; height: 100vh; overflow: hidden; 
            background-image: radial-gradient(#dbe1e8 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #app-container { 
            background: var(--bg-panel); padding: 1.5vw; border-radius: 30px; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 30px 60px rgba(0,0,0,0.08); 
            display: flex; gap: 1.5vw; width: 98vw; height: 96vh; min-height: 0;
        }
        
        #left-panel { 
            flex: 0 0 22%; border-right: 1px solid var(--border-soft); padding-right: 1.2vw; 
            display: flex; flex-direction: column; 
            justify-content: space-between; overflow: hidden;
        }

        #log-area { 
            flex: 0 0 22%; background: var(--bg-terminal); border-radius: 20px; padding: 1.2vw; 
            display: flex; flex-direction: column; 
            border: 2px solid var(--active-color); flex-shrink: 0; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        #center-area { flex: 1; display: flex; flex-direction: column; gap: 1.5vh; min-width: 0; }

        .monitor-card { 
            background: #fff; border-radius: 20px; padding: 2vh 1vw; margin-bottom: 1.5vh; 
            box-shadow: var(--sh-soft); text-align: center; 
        }
        .monitor-card h3 { margin: 0 0 1.5vh 0; font-size: clamp(12px, 1.5vh, 14px); color: var(--text-sec); letter-spacing: 2px; }

        .step-circle { 
            width: clamp(70px, 12vh, 100px); height: clamp(70px, 12vh, 100px); 
            border-radius: 50%; margin: 0 auto 1.5vh; 
            display: flex; align-items: center; justify-content: center; position: relative;
            background: conic-gradient(var(--active-color) 0deg, #edf2f7 0deg);
            box-shadow: var(--sh-inset);
        }
        .step-circle::after { content: ""; position: absolute; width: 82%; height: 82%; background: #fff; border-radius: 50%; }
        #step-display { font-size: clamp(22px, 4vh, 32px); font-weight: 800; color: var(--text-main); z-index: 1; }
        
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: var(--active-color); margin-right: 8px;
            box-shadow: 0 0 10px var(--active-color);
            animation: pulse 1.5s infinite;
            vertical-align: middle;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

        .detail-row { display: flex; align-items: center; justify-content: space-between; padding: 0.8vh 0; border-bottom: 1px solid var(--border-soft); font-size: clamp(11px, 1.3vh, 13px); color: var(--text-main); }

        .config-section {
            border: 1px solid #fff; border-radius: 20px; padding: 2vh 1vw 1vh; margin-bottom: 1vh;
            background: #fff; position: relative; box-shadow: var(--sh-soft); margin-top: 15px;
        }
        .config-label {
            position: absolute; top: -10px; left: 15px; background: var(--active-color);
            padding: 2px 10px; font-size: 11px; color: #fff; font-weight: bold; border-radius: 10px;
        }

        .slider-group { margin-bottom: 0.8vh; background: var(--bg-body); padding: 0.8vh 0.8vw; border-radius: 12px; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sec); margin-bottom: 4px; }
        
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #e0e6ed; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%; background: #fff;
            border: 2px solid var(--active-color); -webkit-appearance: none; margin-top: -5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #canvas-wrapper { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            background: #fff; border-radius: 24px; 
            border: 3px solid #636e72; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1), inset 0 0 10px rgba(0,0,0,0.05); 
            overflow: hidden; padding: 10px;
        }
        canvas { border-radius: 4px; background: #fff; }
        
        #mode-controls { display: flex; gap: 1vw; justify-content: center; padding: 5px 0; flex-shrink: 0; }
        .btn-mode { 
            flex: 1; max-width: 160px; border: none; padding: 2vh 5px; border-radius: 16px; 
            color: white; font-weight: 700; cursor: pointer; transition: all 0.3s ease; 
            font-size: clamp(12px, 1.2vw, 15px);
        }
        .btn-r { background: linear-gradient(145deg, #ff8a8a, var(--red)); box-shadow: 0 5px 0 #d63031; } 
        .btn-f { background: linear-gradient(145deg, #00d4aa, var(--green)); box-shadow: 0 5px 0 #00897b; } 
        .btn-s { background: linear-gradient(145deg, #1fa2ff, var(--blue)); box-shadow: 0 5px 0 #0764ac; } 

        #log-area h4 { color: #fff; margin: 0 0 1.5vh 0; font-size: 14px; border-left: 4px solid var(--active-color); padding-left: 10px; }
        #path-list { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 11px; color: var(--active-color); scrollbar-width: none; }
        .log-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }

        #msg-status { height: 28px; color: var(--active-color); font-weight: 600; text-align: center; font-size: clamp(14px, 1.8vh, 18px); flex-shrink: 0; }
        
        select { width: 100%; padding: 1vh; border-radius: 12px; border: 1px solid var(--border-soft); background: #fff; font-size: 12px; color: var(--text-main); font-weight: 600; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="left-panel">
        <div>
            <div class="monitor-card">
                <h3>实时任务进度</h3>
                <div class="step-circle" id="step-ring"><div id="step-display">0</div></div>
                <div class="detail-row">
                    <span>运行状态:</span>
                    <span><span class="status-dot"></span><b id="mode-text">待命</b></span>
                </div>
                <div class="detail-row"><span>坠崖重置:</span><span id="fail-display">0</span></div>
                <div class="detail-row"><span>当前坐标:</span><span id="coord-display">[0, 3]</span></div>
            </div>

            <div class="config-section">
                <div class="config-label">移动方向概率</div>
                <div class="slider-group"><label>向上 <b id="val-u">0.25</b></label><input type="range" id="sl-u" value="25" oninput="manualSync()"></div>
                <div class="slider-group"><label>向右 <b id="val-r">0.25</b></label><input type="range" id="sl-r" value="25" oninput="manualSync()"></div>
                <div class="slider-group"><label>向下 <b id="val-d">0.25</b></label><input type="range" id="sl-d" value="25" oninput="manualSync()"></div>
                <div class="slider-group"><label>向左 <b id="val-l">0.25</b></label><input type="range" id="sl-l" value="25" oninput="manualSync()"></div>
            </div>
        </div>

        <div style="padding-bottom:1vh;">
            <label style="font-size: 11px; color: var(--text-sec); display:block; margin-bottom:6px; font-weight:600;">模拟演示速度</label>
            <select id="speed">
                <option value="1" selected>瞬间到达</option>
                <option value="50">快速播放</option>
                <option value="150">标准速度</option>
            </select>
        </div>
    </div>

    <div id="center-area">
        <div id="msg-status">准备就绪，请选择模拟模式</div>
        <div id="canvas-wrapper">
            <canvas id="world"></canvas>
        </div>
        <div id="mode-controls">
            <button class="btn-mode btn-r" onclick="run('random')">独行龟模式</button>
            <button class="btn-mode btn-f" onclick="run('follow')">随行龟模式</button>
            <button class="btn-mode btn-s" onclick="run('smart')">智慧龟模式</button>
        </div>
    </div>

    <div id="log-area">
        <h4>路径回溯日志</h4>
        <div id="path-list"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('world'), ctx = canvas.getContext('2d');
    const logList = document.getElementById('path-list'), ring = document.getElementById('step-ring');
    const COLS = 12, ROWS = 4;
    let CELL = 80, pos = {x:0, y:3}, history = [], timer = null, turtleColor = '#00b894';

    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        const availableW = wrapper.clientWidth * 0.96;
        const availableH = wrapper.clientHeight * 0.96;
        CELL = Math.min(availableW / COLS, availableH / ROWS);
        canvas.width = CELL * COLS; canvas.height = CELL * ROWS;
    }

    window.addEventListener('resize', resizeCanvas);

    function drawTurtle(x, y, color) {
        ctx.save();
        ctx.translate(x * CELL + CELL/2, y * CELL + CELL/2);
        const s = CELL/85; // 缩放因子
        ctx.scale(s, s);
        
        // 四肢
        ctx.fillStyle = color;
        ctx.fillRect(-20, -20, 8, 8); // 左前
        ctx.fillRect(12, -20, 8, 8);  // 右前
        ctx.fillRect(-20, 12, 8, 8);  // 左后
        ctx.fillRect(12, 12, 8, 8);   // 右后
        
        // 龟壳主体
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        
        // 龟壳纹路
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = 1;
        // 六边形中心
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(7, -4);
        ctx.lineTo(7, 4);
        ctx.lineTo(0, 8);
        ctx.lineTo(-7, 4);
        ctx.lineTo(-7, -4);
        ctx.closePath();
        ctx.stroke();
        // 连接到边缘
        ctx.beginPath();
        ctx.moveTo(0, -8); ctx.lineTo(0, -18);
        ctx.moveTo(7, -4); ctx.lineTo(16, -9);
        ctx.moveTo(7, 4); ctx.lineTo(16, 9);
        ctx.moveTo(0, 8); ctx.lineTo(0, 18);
        ctx.moveTo(-7, 4); ctx.lineTo(-16, 9);
        ctx.moveTo(-7, -4); ctx.lineTo(-16, -9);
        ctx.stroke();

        // 头部
        ctx.beginPath();
        ctx.arc(0, -25, 8, 0, Math.PI * 2);
        ctx.fill();
        
        // 眼睛
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(-3, -27, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3, -27, 2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(-3, -27, 1, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3, -27, 1, 0, Math.PI*2); ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        
        const time = Date.now();
        const breathAlpha = 0.5 + Math.sin(time / 400) * 0.3;

        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                ctx.strokeStyle = "#a0a8b0"; 
                ctx.lineWidth = 1.5; 
                ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);

                if(r===3 && c>0 && c<11) { 
                    ctx.fillStyle = "#2c3e50"; 
                    ctx.fillRect(c*CELL, r*CELL, CELL, CELL); 
                    ctx.save();
                    ctx.fillStyle = `rgba(255, 118, 117, ${breathAlpha})`;
                    ctx.font = `bold ${CELL/4}px "Microsoft YaHei"`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText("危险", c*CELL + CELL/2, r*CELL + CELL/2);
                    ctx.restore();
                }
                
                if(r===3 && c===11) { 
                    let grad = ctx.createLinearGradient(c*CELL, r*CELL, c*CELL, (r+1)*CELL);
                    grad.addColorStop(0, "#f39c12"); grad.addColorStop(1, "#e67e22");
                    ctx.fillStyle = grad; ctx.fillRect(c*CELL, r*CELL, CELL, CELL); 
                    ctx.fillStyle = "#fff"; ctx.textAlign="center"; ctx.font=`bold ${CELL/5}px "Microsoft YaHei"`;
                    ctx.fillText("宝藏", c*CELL+CELL/2, r*CELL+CELL/1.8);
                }

                ctx.save();
                ctx.font = `bold ${CELL/7}px "Microsoft YaHei"`; ctx.textAlign = "right";
                ctx.fillStyle = (r===3 && c>0 && c<11) ? "#ecf0f1" : "#7f8c8d";
                ctx.fillText(`[${c},${r}]`, (c+1)*CELL - 5, (r+1)*CELL - 5);
                ctx.restore();
            }
        }

        // --- 核心改动：轨迹颜色跟随小乌龟 ---
        if (history.length > 0) {
            ctx.save();
            ctx.beginPath(); 
            ctx.setLineDash([6, 4]); // 虚线效果
            // 使用当前小乌龟的颜色，并添加 0.6 的透明度使其更有质感
            ctx.strokeStyle = turtleColor + "99"; // 添加十六进制透明度 99 (约为 0.6)
            ctx.lineWidth = 3; // 轨迹加粗
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            
            history.forEach((p,i) => { 
                if(i===0) ctx.moveTo((p.x+.5)*CELL, (p.y+.5)*CELL); 
                else ctx.lineTo((p.x+.5)*CELL, (p.y+.5)*CELL); 
            });
            
            ctx.stroke(); 
            ctx.restore();
        }
        
        drawTurtle(pos.x, pos.y, turtleColor);
    }

    function animate() {
        draw();
        requestAnimationFrame(animate);
    }

    function manualSync() {
        let v = ['u','r','d','l'].map(k => parseInt(document.getElementById('sl-'+k).value));
        let total = v.reduce((a,b)=>a+b) || 1;
        ['u','r','d','l'].forEach((k,i) => document.getElementById('val-'+k).innerText = (v[i]/total).toFixed(2));
    }

    function run(m) {
        if(timer) clearInterval(timer);
        document.getElementById('msg-status').innerText = "演化算法计算中...";
        logList.innerHTML = "";
        const config = { 'random': '#ff7675', 'follow': '#00b894', 'smart': '#0984e3' };
        turtleColor = config[m]; // 这里更新了颜色全局变量
        document.documentElement.style.setProperty('--active-color', turtleColor);
        if(m==='random') { ['sl-u','sl-r','sl-d','sl-l'].forEach(id=>document.getElementById(id).value=25); }
        else { document.getElementById('sl-u').value=20; document.getElementById('sl-r').value=40; 
               document.getElementById('sl-d').value=20; document.getElementById('sl-l').value=20; }
        manualSync();
        const limits = { 'random': [1000, 1500], 'follow': [500, 1000], 'smart': [12, 100] };
        const [minSteps, maxSteps] = limits[m];

        setTimeout(() => {
            const weights = ['val-u','val-r','val-d','val-l'].map(id => parseFloat(document.getElementById(id).innerText));
            let finalHistory = null;
            for(let attempt = 0; attempt < 5000; attempt++) {
                let tp={x:0,y:3}, ts=0, tf=0, th=[{p:{...tp},f:0}], visited={};
                visited[`0,3`] = 1;
                while(ts < 2001 && !(tp.x===11 && tp.y===3)) {
                    let opts = [{x:0,y:-1,p:weights[0]}, {x:1,y:0,p:weights[1]}, {x:0,y:1,p:weights[2]}, {x:-1,y:0,p:weights[3]}];
                    if(m === 'smart') {
                        opts.forEach(o => {
                            let nx = tp.x + o.x, ny = tp.y + o.y;
                            let count = visited[`${nx},${ny}`] || 0;
                            if(count > 0) o.p *= Math.pow(0.1, count);
                            if(nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) o.p = 0;
                        });
                    }
                    let sum = opts.reduce((a,b)=>a+b.p, 0);
                    let move;
                    if(sum <= 0) {
                        let legals = opts.filter(o => {
                            let nx = tp.x + o.x, ny = tp.y + o.y;
                            return nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS;
                        });
                        move = legals[Math.floor(Math.random()*legals.length)];
                    } else {
                        let rand = Math.random() * sum;
                        for(let o of opts){ if(rand <= o.p){ move = o; break; } rand -= o.p; }
                    }
                    let nx = tp.x + move.x, ny = tp.y + move.y;
                    if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS) {
                        if(ny===3 && nx>0 && nx<11) { tp={x:0,y:3}; tf++; visited={}; visited[`0,3`]=1; }
                        else { tp={x:nx,y:ny}; visited[`${nx},${ny}`] = (visited[`${nx},${ny}`] || 0) + 1; }
                    }
                    ts++; th.push({p:{...tp},f:tf});
                }
                if(th.length >= minSteps && th.length <= maxSteps) { finalHistory = th; break; }
                if(attempt === 4999) finalHistory = th;
            }

            document.getElementById('mode-text').innerText = "模拟中";
            let i = 0; history = [];
            timer = setInterval(() => {
                const cur = finalHistory[i]; pos = cur.p; history.push({...pos});
                document.getElementById('step-display').innerText = i;
                ring.style.background = `conic-gradient(var(--active-color) ${(i/(finalHistory.length-1))*360}deg, #edf2f7 0deg)`;
                document.getElementById('fail-display').innerText = cur.f;
                document.getElementById('coord-display').innerText = `[${pos.x}, ${pos.y}]`;
                const item = document.createElement('div'); item.className='log-item';
                item.innerHTML = `<span>第 ${i.toString().padStart(4, '0')} 步</span><span>坐标 [${pos.x}, ${pos.y}]</span>`;
                logList.prepend(item);
                if(++i >= finalHistory.length) { 
                    clearInterval(timer);
                    document.getElementById('mode-text').innerText = "已达成";
                    document.getElementById('msg-status').innerText = "成功寻获宝藏！";
                }
            }, parseInt(document.getElementById('speed').value));
        }, 50);
    }

    manualSync(); resizeCanvas(); animate();
</script>
</body>
</html>
