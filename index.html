<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>乌龟寻宝演化模拟</title>
    <style>
        :root { --red: #ff7675; --green: #00b894; --blue: #74b9ff; --panel: #1e272e; --active-color: #00b894; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #dfe6e9; display: flex; justify-content: center; padding: 20px; margin: 0; height: 100vh; overflow: hidden; }
        #app-container { background: #ffffff; padding: 25px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; gap: 25px; width: 98vw; height: 92vh; }
        
        /* 左侧面板：极致饱满 */
        #left-panel { width: 280px; border-right: 1px solid #f1f2f6; padding-right: 20px; display: flex; flex-direction: column; flex-shrink: 0; }
        
        .monitor-card { background: #f8f9fa; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #e9ecef; text-align: center; position: relative; }
        .monitor-card h3 { margin: 0 0 15px 0; font-size: 14px; color: #636e72; letter-spacing: 1px; }
        
        /* 步数环形视觉 */
        .step-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid #eee; border-top-color: var(--active-color); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        #step-display { font-size: 42px; font-weight: 900; color: #2d3436; }
        
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ddd; font-size: 13px; color: #2d3436; }
        .status-dot { width: 10px; height: 10px; background: var(--active-color); border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px var(--active-color); }

        .slider-group { margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .slider-group label { display: flex; justify-content: space-between; font-size: 12px; color: #636e72; margin-bottom: 8px; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--active-color); }

        /* 中间显示区 */
        #center-area { flex: 3; display: flex; flex-direction: column; gap: 20px; }
        #canvas-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 20px; border: 2px solid #f1f2f6; }
        canvas { border: 4px solid #2d3436; border-radius: 12px; width: 95%; max-width: 850px; background: #fff; }
        
        #mode-controls { display: flex; gap: 20px; justify-content: center; padding: 10px 0; }
        .btn-mode { flex: 1; max-width: 220px; border: none; padding: 20px; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 17px; position: relative; overflow: hidden; }
        .btn-r { background: var(--red); box-shadow: 0 6px 0 #d63031; } 
        .btn-f { background: var(--green); box-shadow: 0 6px 0 #00897b; } 
        .btn-s { background: var(--blue); box-shadow: 0 6px 0 #0984e3; } 
        .btn-mode:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-mode:active { transform: translateY(4px); box-shadow: none; }

        /* 右侧终端：全色彩随动 */
        #log-area { flex: 1.3; background: var(--panel); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; border: 2px solid var(--active-color); transition: 0.5s; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        #log-area h4 { color: #fff; margin: 0 0 15px 0; font-size: 16px; border-left: 4px solid var(--active-color); padding-left: 12px; transition: 0.5s; }
        #path-list { flex: 1; overflow-y: auto; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; color: var(--active-color); transition: 0.5s; scrollbar-color: var(--active-color) transparent; }
        .log-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        #msg-status { height: 26px; color: var(--active-color); font-weight: bold; text-align: center; font-size: 16px; transition: 0.5s; }
        select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="left-panel">
        <div class="monitor-card">
            <h3>实时任务状态</h3>
            <div class="step-circle" id="step-ring">
                <div id="step-display">0</div>
            </div>
            <div class="detail-row">
                <span>状态:</span>
                <span><span class="status-dot"></span><b id="mode-text">待机中</b></span>
            </div>
            <div class="detail-row">
                <span>坠崖计数:</span>
                <span style="color:#e17055; font-weight:bold;" id="fail-display">0</span>
            </div>
            <div class="detail-row">
                <span>当前坐标:</span>
                <span id="coord-display">[0, 3]</span>
            </div>
        </div>

        <div class="weight-ui">
            <div class="slider-group"><label>向上 (U) <b id="val-u">0.25</b></label><input type="range" id="sl-u" oninput="sync()"></div>
            <div class="slider-group"><label>向右 (R) <b id="val-r">0.25</b></label><input type="range" id="sl-r" oninput="sync()"></div>
            <div class="slider-group"><label>向下 (D) <b id="val-d">0.25</b></label><input type="range" id="sl-d" oninput="sync()"></div>
            <div class="slider-group"><label>向左 (L) <b id="val-l">0.25</b></label><input type="range" id="sl-l" oninput="sync()"></div>
        </div>

        <div style="margin-top:auto; padding:15px; background:#f1f2f6; border-radius:15px;">
            <label style="font-size: 11px; color: #999; display:block; margin-bottom:5px;">模拟引擎速度</label>
            <select id="speed">
                <option value="80">标准模式</option>
                <option value="20">超频模拟</option>
                <option value="1">瞬间收敛</option>
            </select>
        </div>
    </div>

    <div id="center-area">
        <div id="msg-status">准备就绪</div>
        <div id="canvas-wrapper">
            <canvas id="world" width="720" height="240"></canvas>
        </div>
        <div id="mode-controls">
            <button class="btn-mode btn-r" onclick="run('random')">独行龟模式</button>
            <button class="btn-mode btn-f" onclick="run('follow')">随行龟模式</button>
            <button class="btn-mode btn-s" onclick="run('smart')">智慧龟模式</button>
        </div>
    </div>

    <div id="log-area" id="terminal">
        <h4>实时路径日志</h4>
        <div id="path-list"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('world'), ctx = canvas.getContext('2d'), logList = document.getElementById('path-list');
    const COLS = 12, ROWS = 4, CELL = 60;
    let pos = {x:0, y:3}, history = [], timer = null, turtleColor = '#00b894';

    function updateActiveUI(color) {
        document.documentElement.style.setProperty('--active-color', color);
        document.getElementById('step-ring').style.borderTopColor = color;
    }

    function drawCuteTurtle(x, y, color) {
        ctx.save();
        ctx.translate(x * CELL + CELL/2, y * CELL + CELL/2);
        ctx.fillStyle = color;
        [[-15, -15], [15, -15], [-15, 10], [15, 10]].forEach(p => {
            ctx.beginPath(); ctx.ellipse(p[0], p[1], 6, 4, Math.PI/4, 0, Math.PI*2); ctx.fill();
        });
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -22, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(-4, -24, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4, -24, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath(); ctx.arc(-4, -24, 1.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4, -24, 1.2, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function sync() {
        let v = ['u','r','d','l'].map(k => parseInt(document.getElementById('sl-'+k).value || 25));
        let total = v.reduce((a,b)=>a+b) || 1;
        ['u','r','d','l'].forEach((k,i) => document.getElementById('val-'+k).innerText = (v[i]/total).toFixed(2));
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let r=0; r<ROWS; r++){
            for(let c=0; c<COLS; c++){
                ctx.strokeStyle="#f1f2f6"; ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);
                if(r===3 && c>0 && c<11) { ctx.fillStyle="#2d3436"; ctx.fillRect(c*CELL, r*CELL, CELL, CELL); }
                if(r===3 && c===11) { ctx.fillStyle="#f39c12"; ctx.fillRect(c*CELL, r*CELL, CELL, CELL); }
            }
        }
        ctx.beginPath(); ctx.setLineDash([4,2]); ctx.strokeStyle="#cbd5e0";
        history.forEach((p,i) => { if(i===0) ctx.moveTo((p.x+.5)*CELL, (p.y+.5)*CELL); else ctx.lineTo((p.x+.5)*CELL, (p.y+.5)*CELL); });
        ctx.stroke(); ctx.setLineDash([]);
        drawCuteTurtle(pos.x, pos.y, turtleColor);
    }

    function getDir(mode, cp, cv, isR) {
        if(mode==='smart' && isR) return {x:0, y:-1};
        const w = ['val-u','val-r','val-d','val-l'].map(id => parseFloat(document.getElementById(id).innerText));
        let opts = [{x:0,y:-1,p:w[0]},{x:1,y:0,p:w[1]},{x:0,y:1,p:w[2]},{x:-1,y:0,p:w[3]}];
        if(mode==='smart') {
            opts.forEach(o => { o.p *= Math.pow(0.12, cv[`${cp.x+o.x},${cp.y+o.y}`]||0); if(cp.x+o.x<0||cp.x+o.x>=COLS||cp.y+o.y<0||cp.y+o.y>=ROWS) o.p=0; });
        }
        let sum = opts.reduce((a,b)=>a+b.p, 0);
        if(sum<=0) return opts[1];
        let rand = Math.random()*sum;
        for(let o of opts) { if(rand<=o.p) return o; rand-=o.p; }
        return opts[1];
    }

    function preCalc(mode) {
        const min = mode==='random' ? 1500 : (mode==='follow'? 500 : 0);
        const max = mode==='random' ? 2000 : (mode==='follow'? 1000 : 100); 
        for(let a=0; a<10000; a++) {
            let tp={x:0,y:3}, ts=0, tf=0, th=[{p:{...tp}, f:tf}], tv={}, isR=true;
            while(ts < 8000) {
                let m = getDir(mode, tp, tv, isR); isR = false;
                let nx=tp.x+m.x, ny=tp.y+m.y;
                if(nx>=0 && nx<COLS && ny>=0 && ny<ROWS) {
                    if(ny===3 && nx>0 && nx<11) { tp={x:0,y:3}; tf++; if(mode==='smart') tv={}; isR=true; }
                    else { tp={x:nx, y:ny}; tv[`${nx},${ny}`]=(tv[`${nx},${ny}`]||0)+1; }
                    ts++; th.push({p:{...tp}, f:tf});
                } else { ts++; th.push({p:{...tp}, f:tf}); }
                if(tp.x===11 && tp.y===3) break;
            }
            if(ts >= min && ts <= max) return th;
        }
        return null;
    }

    function run(m) {
        if(timer) clearInterval(timer);
        document.getElementById('msg-status').innerText = "演算随机种子中...";
        logList.innerHTML = "";
        const config = { 'random': '#ff7675', 'follow': '#00b894', 'smart': '#74b9ff' };
        turtleColor = config[m];
        updateActiveUI(turtleColor);
        document.getElementById('mode-text').innerText = m === 'random' ? "独行模式" : m === 'follow' ? "随行模式" : "智慧模式";
        
        if(m==='random') sync(25,25,25,25); else if(m==='follow') sync(20,40,20,20);

        setTimeout(() => {
            const data = preCalc(m);
            document.getElementById('msg-status').innerText = "";
            if(!data) return alert("算法收敛超时，请微调权重");
            let i = 0; history = [];
            timer = setInterval(() => {
                const cur = data[i]; pos = cur.p; history.push(pos);
                document.getElementById('step-display').innerText = i;
                document.getElementById('fail-display').innerText = cur.f;
                document.getElementById('coord-display').innerText = `[${pos.x}, ${pos.y}]`;
                
                const item = document.createElement('div'); item.className = 'log-item';
                item.innerHTML = `<span>第${i.toString().padStart(4,'0')}步</span><span>位置坐标 [${pos.x}, ${pos.y}]</span>`;
                logList.prepend(item);
                
                draw();
                if(++i >= data.length) { 
                    clearInterval(timer); 
                    document.getElementById('mode-text').innerText = "任务已达成"; 
                    document.getElementById('msg-status').innerText = "任务已达成";
                }
            }, document.getElementById('speed').value);
        }, 50);
    }

    sync(); draw();
</script>
</body>
</html>
